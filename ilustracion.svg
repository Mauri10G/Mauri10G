<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="scarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>

    <linearGradient id="wandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c6905a"/>
      <stop offset="50%" stop-color="#7c4a2f"/>
      <stop offset="100%" stop-color="#3d2418"/>
    </linearGradient>

    <linearGradient id="codeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61dafb"/>
      <stop offset="100%" stop-color="#8affc1"/>
    </linearGradient>

    <radialGradient id="magicHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe58a" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#f7c948" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f7c948" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtros -->
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Chispa -->
    <symbol id="spark" viewBox="-20 -20 40 40">
      <path d="M0,-14 L3,-3 L14,0 L3,3 L0,14 L-3,3 L-14,0 L-3,-3 Z" fill="#ffd95a"/>
    </symbol>

    <!-- Ruta de magia -->
    <path id="magicPath" d="M790 190 C845 150, 910 138, 1000 150 C1065 160, 1110 145, 1150 130" />
  </defs>

  <!-- Fondo transparente -->
  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Halo mágico central -->
  <ellipse cx="600" cy="155" rx="240" ry="90" fill="url(#magicHalo)" opacity="0.45" filter="url(#bigGlow)">
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="4.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Código flotando -->
  <g font-family="monospace" font-size="26" fill="url(#codeGlow)" opacity="0.7" filter="url(#softGlow)">
    <text x="155" y="120">&lt;/&gt;
      <animate attributeName="y" values="120;108;120" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.85;0.45" dur="4s" repeatCount="indefinite"/>
    </text>

    <text x="1000" y="115">{ }
      <animate attributeName="y" values="115;102;115" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.8;0.35" dur="4.8s" repeatCount="indefinite"/>
    </text>

    <text x="180" y="210">git
      <animate attributeName="y" values="210;198;210" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.30;0.70;0.30" dur="5.2s" repeatCount="indefinite"/>
    </text>

    <text x="965" y="215">npm
      <animate attributeName="y" values="215;204;215" dur="5.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="5.6s" repeatCount="indefinite"/>
    </text>

    <text x="285" y="72">const
      <animate attributeName="y" values="72;58;72" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.65;0.25" dur="6s" repeatCount="indefinite"/>
    </text>

    <text x="860" y="72">class WizardDev
      <animate attributeName="y" values="72;58;72" dur="6.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="6.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Grupo central con flotación -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform"
      type="translate"
      values="0 0; 0 -4; 0 0; 0 4; 0 0"
      dur="7s"
      repeatCount="indefinite"/>

    <!-- Gafas -->
    <g stroke="#0d0d0d" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="470" cy="155" r="52" stroke-width="9"/>
      <circle cx="730" cy="155" r="52" stroke-width="9"/>
      <path d="M522 155 Q600 136 678 155" stroke-width="9"/>
      <path d="M418 146 L372 126" stroke-width="7"/>
      <path d="M782 146 L828 126" stroke-width="7"/>

      <!-- reflejos -->
      <path d="M438 126 Q455 116 477 118" stroke="#ffffff" stroke-width="5" opacity="0.45"/>
      <path d="M698 126 Q715 116 737 118" stroke="#ffffff" stroke-width="5" opacity="0.45"/>
    </g>

    <!-- sombra interior -->
    <ellipse cx="470" cy="160" rx="42" ry="34" fill="#000000" opacity="0.08"/>
    <ellipse cx="730" cy="160" rx="42" ry="34" fill="#000000" opacity="0.08"/>

    <!-- cicatriz -->
    <g filter="url(#softGlow)">
      <path d="M585 70 L612 114 L580 114 L628 184"
            fill="none"
            stroke="url(#scarGradient)"
            stroke-width="12"
            stroke-linejoin="round"
            stroke-linecap="round">
        <animate attributeName="stroke-width" values="12;14;12" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M585 70 L612 114 L580 114 L628 184"
            fill="none"
            stroke="#fff7be"
            stroke-width="3"
            opacity="0.75"
            stroke-linejoin="round"
            stroke-linecap="round">
        <animate attributeName="opacity" values="0.4;0.95;0.4" dur="2.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Varita -->
  <g transform="rotate(-15 880 220)" filter="url(#shadow)">
    <animateTransform attributeName="transform"
      type="rotate"
      values="-15 880 220; -11 880 220; -15 880 220; -18 880 220; -15 880 220"
      dur="4s"
      repeatCount="indefinite"/>

    <rect x="800" y="212" width="145" height="12" rx="6" fill="url(#wandGradient)"/>
    <rect x="793" y="210" width="14" height="16" rx="3" fill="#d6a56d"/>
  </g>

  <!-- Estela mágica -->
  <g filter="url(#softGlow)">
    <path d="M790 190 C845 150, 910 138, 1000 150 C1065 160, 1110 145, 1150 130"
          fill="none"
          stroke="#ffd95a"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-dasharray="3 11"
          opacity="0.8">
      <animate attributeName="stroke-dashoffset" values="0;-70" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.9;0.45" dur="2.5s" repeatCount="indefinite"/>
    </path>

    <!-- partículas moviéndose -->
    <circle r="4" fill="#ffe17b">
      <animateMotion dur="2.2s" repeatCount="indefinite">
        <mpath href="#magicPath"/>
      </animateMotion>
    </circle>

    <circle r="3" fill="#fff2b0">
      <animateMotion dur="2.8s" begin="0.4s" repeatCount="indefinite">
        <mpath href="#magicPath"/>
      </animateMotion>
    </circle>

    <circle r="2.8" fill="#ffd95a">
      <animateMotion dur="3.1s" begin="0.9s" repeatCount="indefinite">
        <mpath href="#magicPath"/>
      </animateMotion>
    </circle>

    <use href="#spark" x="1120" y="118" width="22" height="22">
      <animateTransform attributeName="transform"
        type="rotate"
        values="0 1131 129;360 1131 129"
        dur="4s"
        repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2s" repeatCount="indefinite"/>
    </use>

    <use href="#spark" x="1062" y="140" width="12" height="12" opacity="0.8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.8s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Estrellas pequeñas -->
  <g filter="url(#softGlow)">
    <circle cx="400" cy="92" r="2.5" fill="#ffe27a">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="442" cy="80" r="1.8" fill="#fff2aa">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="98" r="2.1" fill="#ffe27a">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="812" cy="116" r="1.7" fill="#fff2aa">
      <animate attributeName="opacity" values="0.3;0.85;0.3" dur="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Terminal -->
  <g filter="url(#shadow)">
    <rect x="235" y="255" width="730" height="110" rx="18" fill="#0b1220" opacity="0.92" stroke="#1d2a44" stroke-width="2"/>
    <rect x="235" y="255" width="730" height="30" rx="18" fill="#10192d"/>
    <circle cx="262" cy="270" r="5" fill="#ff5f56"/>
    <circle cx="280" cy="270" r="5" fill="#ffbd2e"/>
    <circle cx="298" cy="270" r="5" fill="#27c93f"/>

    <text x="330" y="274" fill="#9bb0d3" font-size="15" font-family="monospace">wizard-terminal</text>

    <text x="270" y="315" fill="#8affc1" font-size="24" font-family="monospace">$ const wizard = "Oscar Guevara";</text>
    <text x="270" y="345" fill="#61dafb" font-size="21" font-family="monospace">&gt; building magic with code</text>

    <!-- cursor -->
    <rect x="665" y="328" width="10" height="22" fill="#8affc1">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

 
</svg>
